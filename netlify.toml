[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/printify"
  to = "/.netlify/functions/printify"
  status = 200

[[redirects]]
  from = "/api/etsy"
  to = "/.netlify/functions/etsy"
  status = 200

